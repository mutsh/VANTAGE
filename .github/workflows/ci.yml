name: Verify package and analysis
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install .
      - run: python -m unittest discover -s tests -v
      - run: vantage scan --repo src --format sarif > vantage.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: sarif-${{ matrix.python }}
          path: vantage.sarif
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vantage:ci .
      - run: docker run --rm --network none --read-only --cap-drop ALL vantage:ci --help
