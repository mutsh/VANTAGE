[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vantage-evidence-repair"
version = "0.1.0"
description = "Evidence-guided, human-gated security repair agent for VANTAGE"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vantage = "vantage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
